# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# JDK utilisé pour LANCER Gradle (piège JAVA_HOME : le défaut système est un JDK 8).
# La toolchain compile en Java 21 (auto-provisionnée via foojay).
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Parchment mappings (https://parchmentmc.org/docs/getting-started)
neogradle.subsystems.parchment.minecraftVersion=1.20.6
neogradle.subsystems.parchment.mappingsVersion=2024.06.16

## Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.20.6
minecraft_version_range=[1.20.6,1.21)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=20.6.135

## Mod Properties
mod_id=elixirs
# Loader (forge/neoforge) : sert à nommer le build archivé pour les versions MC qui ont les deux loaders.
mod_loader=neoforge
mod_name=Elixirs
mod_license=All Rights Reserved
mod_version=1.2.0
mod_group_id=com.natsu.elixirs
mod_authors=Natsu91
mod_description=A mod that adds lots of new potions effects, to be used by other modders / my own mods.
